<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Retro Realms Collectibles</title>
  <meta name="description" content="The Retro Realms Collectibles — retro games, trading cards, comics, vintage toys, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: 'Inter', sans-serif;
      color: #e8e8ef;
      background: #080816 url('background.png') center / cover no-repeat fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 76% 38%, rgba(0, 255, 208, 0.12), transparent 30rem),
        rgba(3, 3, 14, 0.66);
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      grid-template-rows: 1fr auto;
      gap: 1.5rem;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 3rem);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(270px, 360px);
      align-items: center;
      gap: clamp(2rem, 7vw, 6rem);
    }

    .identity {
      max-width: 660px;
    }

    .icon {
      margin-bottom: 1.75rem;
      font-size: clamp(3rem, 6vw, 4.5rem);
      line-height: 1;
      filter: drop-shadow(0 0 24px rgba(0, 255, 208, 0.34));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .logo {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.45rem, 4.2vw, 3rem);
      line-height: 1.45;
      background: linear-gradient(135deg, #ff6ec7 5%, #ffcc00 52%, #ff6ec7 95%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(255, 110, 199, 0.35));
    }

    .tagline {
      margin-top: 1rem;
      color: #b8b8c5;
      font-size: clamp(0.78rem, 1.8vw, 1rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .coming-soon {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.9rem 1.35rem;
      border: 2px solid rgba(0, 255, 208, 0.48);
      border-radius: 5px;
      color: #ff79ca;
      background: rgba(0, 255, 208, 0.07);
      box-shadow: 0 0 28px rgba(0, 255, 208, 0.08);
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.6rem, 1.5vw, 0.76rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 2rem;
    }

    .categories span {
      padding: 0.45rem 0.78rem;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      color: #c7c7d0;
      background: rgba(255, 255, 255, 0.07);
      font-size: 0.74rem;
    }

    .video-frame {
      position: relative;
      width: min(100%, 360px);
      justify-self: end;
      padding: 3px;
      border-radius: 22px;
      background: linear-gradient(145deg, #ff6ec7, #ffcc00 48%, #00ffd0);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        0 0 48px rgba(0, 255, 208, 0.14);
    }

    .video-frame::before {
      content: '';
      position: absolute;
      inset: -18px;
      z-index: -1;
      border-radius: 34px;
      background: rgba(255, 110, 199, 0.14);
      filter: blur(26px);
    }

    .video-frame video {
      display: block;
      width: 100%;
      aspect-ratio: 704 / 1280;
      border-radius: 19px;
      background: #000;
      object-fit: cover;
    }

    .footer {
      color: #747482;
      font-size: 0.74rem;
      text-align: center;
    }

    .footer a {
      color: #aaaab6;
      text-decoration: none;
    }

    .footer a:hover,
    .footer a:focus-visible {
      color: #ff79ca;
    }

    @media (max-width: 760px) {
      body {
        background-attachment: scroll;
      }

      .page {
        gap: 2rem;
        padding-bottom: 1.5rem;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 2.5rem;
        padding-top: 1rem;
      }

      .identity {
        text-align: center;
      }

      .categories {
        justify-content: center;
      }

      .video-frame {
        width: min(88vw, 340px);
        justify-self: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .icon {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="site-title">
      <div class="identity">
        <div class="icon" aria-hidden="true">🎮</div>
        <h1 class="logo" id="site-title">The Retro Realms<br>Collectibles</h1>
        <p class="tagline">Level up your collection</p>
        <div class="coming-soon">Coming Soon</div>
        <div class="categories" aria-label="Collectible categories">
          <span>Retro Games</span>
          <span>Trading Cards</span>
          <span>Comics</span>
          <span>Vintage Toys</span>
          <span>Collectibles</span>
        </div>
      </div>

      <div class="video-frame">
        <video id="remo-video" autoplay loop muted playsinline controls preload="metadata" width="704" height="1280" aria-label="Remo, The Retro Realms Collectibles mascot">
          <source src="intro.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <p class="footer">theretrorealmscollectibles.com · <a href="privacy-policy.html">Privacy Policy</a></p>
  </main>

  <script>
    const remoVideo = document.getElementById('remo-video');

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      remoVideo.removeAttribute('autoplay');
      remoVideo.pause();
      remoVideo.currentTime = 0;
    }
  </script>
</body>
</html>
