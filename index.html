<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Retro Realms Collectibles</title>
  <meta name="description" content="Sell your collection or shop retro games, trading cards, comics, vintage toys, and more at The Retro Realms Collectibles.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: 'Inter', sans-serif;
      color: #e8e8ef;
      background: #080816 url('background.png') center / cover no-repeat fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 76% 38%, rgba(0, 255, 208, 0.12), transparent 30rem),
        rgba(3, 3, 14, 0.66);
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      grid-template-rows: 1fr auto;
      gap: 1.5rem;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 3rem);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 485px);
      align-items: center;
      gap: clamp(2rem, 7vw, 6rem);
    }

    .identity {
      max-width: 660px;
    }

    .icon {
      margin-bottom: 1.75rem;
      font-size: clamp(3rem, 6vw, 4.5rem);
      line-height: 1;
      filter: drop-shadow(0 0 24px rgba(0, 255, 208, 0.34));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .logo {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.2rem, 2.8vw, 2rem);
      line-height: 1.55;
      background: linear-gradient(135deg, #ff6ec7 5%, #ffcc00 52%, #ff6ec7 95%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(255, 110, 199, 0.35));
    }

    .logo-line {
      display: block;
      white-space: nowrap;
    }

    .tagline {
      margin-top: 1rem;
      color: #ffd0e8;
      font-size: clamp(0.78rem, 1.8vw, 1rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .actions {
      display: grid;
      gap: 1.25rem;
      width: min(100%, 600px);
      margin-top: 2rem;
    }

    .sell-button {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      min-height: 108px;
      padding: 1.15rem 1.25rem;
      overflow: hidden;
      border: 2px solid #ffb15c;
      border-radius: 10px;
      color: #17091f;
      background: linear-gradient(115deg, #ff9a3d 0%, #ff4f9a 52%, #8a4fff 100%);
      box-shadow:
        7px 7px 0 #6e36d9,
        0 0 38px rgba(255, 79, 154, 0.24);
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .sell-button::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.24;
      background: repeating-linear-gradient(
        0deg,
        transparent 0 5px,
        rgba(255, 255, 255, 0.45) 5px 6px
      );
    }

    .sell-button:hover,
    .sell-button:focus-visible {
      transform: translate(-3px, -3px);
      box-shadow:
        10px 10px 0 #6e36d9,
        0 0 48px rgba(255, 79, 154, 0.36);
    }

    .sell-button:focus-visible,
    .market-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .action-kicker,
    .shop-title {
      display: block;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .action-kicker {
      margin-bottom: 0.6rem;
      opacity: 0.66;
    }

    .action-label {
      display: block;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.88rem, 2vw, 1.12rem);
      line-height: 1.45;
    }

    .action-arrow {
      font-size: 2rem;
      line-height: 1;
      transition: transform 160ms ease;
    }

    .sell-button:hover .action-arrow,
    .sell-button:focus-visible .action-arrow {
      transform: translateX(5px);
    }

    .shop {
      display: grid;
      gap: 0.75rem;
    }

    .shop-title {
      color: #a9a9b7;
    }

    .market-links {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.7rem;
    }

    .market-link {
      display: grid;
      min-height: 50px;
      place-items: center;
      padding: 0.8rem 0.65rem;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 7px;
      color: #f6f6fb;
      background: rgba(8, 8, 22, 0.78);
      box-shadow: 3px 3px 0 rgba(255, 204, 0, 0.74);
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.52rem, 1.2vw, 0.64rem);
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
      transition: border-color 160ms ease, color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .market-link:hover,
    .market-link:focus-visible {
      border-color: #ff6ec7;
      color: #00ffd0;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #ff6ec7;
    }

    .market-link.is-pending {
      cursor: default;
      opacity: 0.62;
    }

    .video-frame {
      position: relative;
      width: 485px;
      max-width: 100%;
      justify-self: end;
      padding: 3px;
      border-radius: 22px;
      background: linear-gradient(145deg, #ff6ec7, #ffcc00 48%, #00ffd0);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        0 0 48px rgba(0, 255, 208, 0.14);
    }

    .video-frame::before {
      content: '';
      position: absolute;
      inset: -18px;
      z-index: -1;
      border-radius: 34px;
      background: rgba(255, 110, 199, 0.14);
      filter: blur(26px);
    }

    .video-frame video {
      display: block;
      width: 100%;
      height: 705px;
      aspect-ratio: auto;
      border-radius: 19px;
      background: #000;
      object-fit: cover;
      object-position: center 66%;
    }

    .footer {
      color: #747482;
      font-size: 0.74rem;
      text-align: center;
    }

    .footer a {
      color: #aaaab6;
      text-decoration: none;
    }

    .footer a:hover,
    .footer a:focus-visible {
      color: #ff79ca;
    }

    @media (max-width: 760px) {
      body {
        background-attachment: scroll;
      }

      .page {
        gap: 2rem;
        padding-bottom: 1.5rem;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 2.5rem;
        padding-top: 1rem;
      }

      .identity {
        text-align: center;
      }

      .actions {
        margin-inline: auto;
        text-align: left;
      }

      .video-frame {
        width: min(92vw, 400px);
        justify-self: center;
      }

      .video-frame video {
        height: auto;
        aspect-ratio: 479 / 705;
      }
    }

    @media (max-width: 430px) {
      .sell-button {
        min-height: 96px;
      }

      .market-links {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .icon {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="site-title">
      <div class="identity">
        <div class="icon" aria-hidden="true">🎮</div>
        <h1 class="logo" id="site-title">
          <span class="logo-line">The Retro Realms</span>
          <span class="logo-line">Collectibles</span>
        </h1>
        <p class="tagline">We Buy Nostalgia</p>
        <section class="actions" aria-label="Buy or sell collectibles">
          <div class="sell-button">
            <span>
              <span class="action-kicker">Cards · games · toys · comics</span>
              <span class="action-label">Sell your collection</span>
            </span>
            <span class="action-arrow" aria-hidden="true">→</span>
          </div>

          <div class="shop">
            <span class="shop-title">Shop Our Stores</span>
            <div class="market-links">
              <a class="market-link" href="https://www.ebay.com/str/theretrorealmscollectables" target="_blank" rel="noopener noreferrer">eBay</a>
              <span class="market-link is-pending" aria-disabled="true">Mercari</span>
              <span class="market-link is-pending" aria-disabled="true">Facebook</span>
            </div>
          </div>
        </section>
      </div>

      <div class="video-frame">
        <video id="remo-video" autoplay loop muted playsinline controls preload="metadata" width="704" height="1280" aria-label="Remo, The Retro Realms Collectibles mascot">
          <source src="intro.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <p class="footer">theretrorealmscollectibles.com · <a href="privacy-policy.html">Privacy Policy</a></p>
  </main>

  <script>
    const remoVideo = document.getElementById('remo-video');

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      remoVideo.removeAttribute('autoplay');
      remoVideo.pause();
      remoVideo.currentTime = 0;
    }
  </script>
</body>
</html>
